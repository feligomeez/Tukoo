version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgre
    restart: always
    environment:
      POSTGRES_DB: tukoo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mochuelo
    ports:
      - "5433:5433"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  userapp:
    build: ./userService
    container_name: userapp
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tukoo
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: mochuelo
    depends_on:
      - postgres
    ports:
      - "8082:8082"

  listingapp:
    build: ./listingService
    container_name: listingapp
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tukoo
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: mochuelo
    depends_on:
      - postgres
    ports:
      - "8080:8080"

  reviewapp:
    build: ./reviewService
    container_name: reviewapp
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tukoo
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: mochuelo
    depends_on:
      - postgres
    ports:
      - "8083:8083"

  chatapp:
    build: ./chatService
    container_name: chatapp
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tukoo
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: mochuelo
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - postgres
    ports:
      - "8084:8080"

  flutterapp:
    build: ./frontend
    container_name: flutterapp
    restart: always
    ports:
      - "8081:8081"

volumes:
  postgres_data:
